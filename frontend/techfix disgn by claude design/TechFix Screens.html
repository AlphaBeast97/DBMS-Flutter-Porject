<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TechFix — Screens</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet" />
<style>
  * { -webkit-font-smoothing: antialiased; box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: 'Space Grotesk', system-ui, sans-serif; color: #141414; }
  .msr {
    font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal;
    display: inline-block; line-height: 1; white-space: nowrap; user-select: none;
    font-feature-settings: 'liga' 1; -webkit-font-feature-settings: 'liga' 1;
  }
  button, input, textarea { font-family: 'Space Grotesk', sans-serif; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  input::placeholder, textarea::placeholder { color: rgba(20,20,20,0.36); }
  .shimmer { background: linear-gradient(90deg, rgba(20,20,20,0.06) 25%, rgba(20,20,20,0.12) 37%, rgba(20,20,20,0.06) 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes popIn { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: scale(1); } }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="frames/design-canvas.jsx"></script>
<script type="text/babel" src="src/ds-core.jsx"></script>
<script type="text/babel" src="src/ds-cards.jsx"></script>
<script type="text/babel" src="src/data.jsx"></script>
<script type="text/babel" src="src/screens-login.jsx"></script>
<script type="text/babel" src="src/screens-customer.jsx"></script>
<script type="text/babel" src="src/screens-technician.jsx"></script>
<script type="text/babel" src="src/screens-manager.jsx"></script>
<script type="text/babel" src="src/app.jsx"></script>

<script type="text/babel">
const W = 372, H = 760;

// A clean phone-sized screen tile (no device bezel) for canvas display.
function Tile({ children }) {
  return (
    <div style={{
      width: W, height: H, borderRadius: 26, overflow: 'hidden',
      border: '1px solid rgba(20,20,20,0.10)', background: COLORS.cream,
      boxShadow: '0 1px 0 rgba(255,255,255,0.6) inset',
    }}>
      <div style={{ height: '100%', pointerEvents: 'none' }}>{children}</div>
    </div>
  );
}

function App() {
  return (
    <DesignCanvas>
      <DCSection id="flows" title="TechFix · Core screens" subtitle="Mostly-Material-3 direction · exact palette + Space Grotesk">
        <DCArtboard id="login" label="Login · 3 roles" width={W} height={H}>
          <Tile><LoginScreen onSignIn={() => {}} /></Tile>
        </DCArtboard>
        <DCArtboard id="customer" label="Customer · My Repairs" width={W} height={H}>
          <Tile><HomeShell role="customer" screenState="loaded" initialTab="customer" /></Tile>
        </DCArtboard>
        <DCArtboard id="technician" label="Technician Console" width={W} height={H}>
          <Tile><HomeShell role="employee" screenState="loaded" initialTab="technician" /></Tile>
        </DCArtboard>
        <DCArtboard id="manager" label="Manager Overview" width={W} height={H}>
          <Tile><HomeShell role="owner" screenState="loaded" initialTab="manager" /></Tile>
        </DCArtboard>
      </DCSection>

      <DCSection id="states" title="States" subtitle="Empty · loading · error — shown on the Technician console">
        <DCArtboard id="empty" label="Empty" width={W} height={H}>
          <Tile><HomeShell role="employee" screenState="empty" initialTab="technician" /></Tile>
        </DCArtboard>
        <DCArtboard id="loading" label="Loading (skeletons)" width={W} height={H}>
          <Tile><HomeShell role="employee" screenState="loading" initialTab="technician" /></Tile>
        </DCArtboard>
        <DCArtboard id="error" label="Error" width={W} height={H}>
          <Tile><HomeShell role="employee" screenState="error" initialTab="technician" /></Tile>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
